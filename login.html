<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Mendocino</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0F2B2C 0%, #1E7B7D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            direction: rtl;
            position: relative;
            overflow: hidden;
        }

        /* أشكال خلفية متحركة */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #4DB8BA;
            top: -100px;
            right: -100px;
            animation: float 8s ease-in-out infinite;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #2A9D9F;
            bottom: -100px;
            left: -100px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* بطاقة تسجيل الدخول */
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* الشعار */
        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2A9D9F, #1E7B7D);
            color: #ffffff;
            border-radius: 24px;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            box-shadow: 0 10px 30px rgba(42, 157, 159, 0.4);
        }

        .brand h1 {
            font-size: 1.8rem;
            color: #0F2B2C;
            font-weight: 900;
            margin-bottom: 0.3rem;
        }

        .brand p {
            color: #6B7280;
            font-size: 0.9rem;
        }

        /* النموذج */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            color: #0F2B2C;
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            color: #1a1a1a;
            outline: none;
            transition: all 0.3s ease;
            background: #F9FAFB;
        }

        .form-group input:focus {
            border-color: #2A9D9F;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(42, 157, 159, 0.15);
        }

        .form-group input::placeholder {
            color: #9CA3AF;
        }

        /* زر تسجيل الدخول */
        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #2A9D9F, #1E7B7D);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(42, 157, 159, 0.35);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(42, 157, 159, 0.5);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* رسائل الخطأ */
        .error-message {
            background: #FEF2F2;
            color: #EF4444;
            padding: 0.9rem 1.2rem;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid #FCA5A5;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .error-message.show {
            display: flex;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* نجاح */
        .success-message {
            background: #ECFDF5;
            color: #10B981;
            padding: 0.9rem 1.2rem;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid #6EE7B7;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .success-message.show {
            display: flex;
        }

        /* السبينر */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .spinner.show {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* رابط العودة */
        .back-home {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #E5E7EB;
        }

        .back-home a {
            color: #6B7280;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .back-home a:hover {
            color: #2A9D9F;
        }

        /* أيقونة إظهار كلمة المرور */
        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: #9CA3AF;
            padding: 0.3rem;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: #2A9D9F;
        }

        /* استجابة الشاشات */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
                border-radius: 20px;
            }

            .brand-icon {
                width: 65px;
                height: 65px;
                font-size: 2rem;
            }

            .brand h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">✚</div>
            <h1>Mendocino</h1>
            <p>تسجيل الدخول إلى لوحة التحكم</p>
        </div>

        <div class="error-message" id="errorMessage">
            <span>⚠️</span>
            <span id="errorText">حدث خطأ</span>
        </div>

        <div class="success-message" id="successMessage">
            <span>✓</span>
            <span>تم تسجيل الدخول! جارٍ التحويل...</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="admin@example.com" 
                    required 
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="toggle-password" id="togglePassword">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">دخول</span>
            </button>
        </form>

        <div class="back-home">
            <a href="index.html">
                <span>←</span>
                <span>العودة للموقع</span>
            </a>
        </div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './firebase-config.js';

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const successMessage = document.getElementById('successMessage');
        const togglePassword = document.getElementById('togglePassword');

        // ===== إظهار/إخفاء كلمة المرور =====
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // ===== إذا كان المستخدم مسجل دخول مسبقاً، انتقل مباشرة =====
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        // ===== إرسال النموذج =====
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('الرجاء إدخال البريد وكلمة المرور');
                return;
            }

            // تعطيل الزر وإظهار السبينر
            loginBtn.disabled = true;
            btnText.textContent = 'جارٍ الدخول...';
            spinner.classList.add('show');
            errorMessage.classList.remove('show');

            try {
                await signInWithEmailAndPassword(auth, email, password);

                // نجاح
                successMessage.classList.add('show');
                spinner.classList.remove('show');
                btnText.textContent = '✓ تم الدخول';

                // الانتقال بعد لحظة
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);

            } catch (error) {
                console.error('خطأ تسجيل الدخول:', error);
                spinner.classList.remove('show');
                loginBtn.disabled = false;
                btnText.textContent = 'دخول';

                // ترجمة رسالة الخطأ
                let message = 'حدث خطأ غير متوقع';
                switch (error.code) {
                    case 'auth/invalid-email':
                        message = 'البريد الإلكتروني غير صحيح';
                        break;
                    case 'auth/user-not-found':
                        message = 'المستخدم غير موجود';
                        break;
                    case 'auth/wrong-password':
                    case 'auth/invalid-credential':
                        message = 'كلمة المرور غير صحيحة';
                        break;
                    case 'auth/too-many-requests':
                        message = 'محاولات كثيرة خاطئة. حاول لاحقاً';
                        break;
                    case 'auth/network-request-failed':
                        message = 'تحقق من اتصالك بالإنترنت';
                        break;
                    default:
                        message = 'فشل تسجيل الدخول: ' + error.message;
                }
                showError(message);
            }
        });

        function showError(msg) {
            errorText.textContent = msg;
            errorMessage.classList.add('show');
        }
    </script>

</body>
</html>
